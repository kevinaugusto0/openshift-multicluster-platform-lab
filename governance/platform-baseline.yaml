# Baseline governance for every cluster in the "platform" set.
# Policies run in "inform" mode: Git (via Argo CD) is the source of truth
# and remediates; RHACM audits and reports drift.
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-tenant-baseline
  namespace: platform-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-7 Boundary Protection
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: tenant-baseline
        spec:
          remediationAction: inform
          severity: high
          namespaceSelector:
            include:
              - team-*
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: default-deny-ingress
                spec:
                  podSelector: {}
                  policyTypes:
                    - Ingress
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ResourceQuota
                metadata:
                  name: tenant-quota
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: LimitRange
                metadata:
                  name: tenant-limits
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-kubeadmin-removed
  namespace: platform-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-2 Account Management
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: kubeadmin-removed
        spec:
          remediationAction: inform
          severity: medium
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: kubeadmin
                  namespace: kube-system
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-etcd-encryption
  namespace: platform-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-28 Protection of Information at Rest
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: etcd-encryption
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            # Use aesgcm instead if that is your cluster standard.
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: APIServer
                metadata:
                  name: cluster
                spec:
                  encryption:
                    type: aescbc
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: platform-baseline
  namespace: platform-policies
spec:
  description: Baseline governance for every cluster in the platform clusterset.
  policies:
    - policy-tenant-baseline
    - policy-kubeadmin-removed
    - policy-etcd-encryption
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: platform-policies
  namespace: platform-policies
spec:
  clusterSets:
    - platform
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: platform-baseline
  namespace: platform-policies
placementRef:
  name: platform-policies
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: platform-baseline
    kind: PolicySet
    apiGroup: policy.open-cluster-management.io
