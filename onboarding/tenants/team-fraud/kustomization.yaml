apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-fraud
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs:
      platform.lab/tenant: fraud
patches:
  - target:
      kind: RoleBinding
      name: tenant-admins
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: fraud-admins
