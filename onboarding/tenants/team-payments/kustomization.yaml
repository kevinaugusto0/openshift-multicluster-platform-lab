apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-payments
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs:
      platform.lab/tenant: payments
patches:
  - target:
      kind: RoleBinding
      name: tenant-admins
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: payments-admins
  # Bigger footprint than the default tenant.
  - target:
      kind: ResourceQuota
      name: tenant-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: "8"
      - op: replace
        path: /spec/hard/limits.cpu
        value: "16"
      - op: replace
        path: /spec/hard/requests.memory
        value: 16Gi
      - op: replace
        path: /spec/hard/limits.memory
        value: 32Gi
